name: weekly-hist

on:
  schedule:
    - cron: "0 16 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch monthly price history
        run: python3 scripts/fetch_hist.py

      - name: Commit docs/data/hist if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/hist hist_watchlist.txt
          if git diff --cached --quiet; then
            echo "No hist changes to commit"
          else
            git commit -m "chore: update monthly price history"
            git push
          fi

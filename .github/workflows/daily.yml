name: daily

on:
  schedule:
    - cron: "30 6 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Fubon NAV and holdings
        continue-on-error: true
        run: python3 scripts/fetch_fubon.py

      - name: Fetch market prices
        continue-on-error: true
        run: python3 scripts/fetch_prices.py

      - name: Commit docs/data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: update daily NAV, holdings, and prices"
            git push
          fi
